<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button[disabled] { opacity: .6; }
    .result:empty { display: none; }
    .result { margin-top: 1rem; }
    .topic { font-weight: 600; }
    .notice { padding: .5rem .75rem; border-left: 3px solid #b45309; background: #fffbeb; }
    .error { color: #b91c1c; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" class="result" aria-live="polite">
    <p id="topic" class="topic"></p>
    <pre id="draft"></pre>
    <p id="notice" class="notice" hidden></p>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const topicField = document.querySelector("#topic");
    const draftField = document.querySelector("#draft");
    const notice = document.querySelector("#notice");

    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    function clearOutput() {
      topicField.textContent = "";
      draftField.textContent = "";
      notice.textContent = "";
      notice.classList.remove("error");
      notice.hidden = true;
    }

    function renderResult(data) {
      clearOutput();
      if (data.status === "ready") {
        topicField.textContent = `Тема: ${TOPIC_LABELS[data.topic] ?? data.topic}`;
        draftField.textContent = data.draft;
        return;
      }
      if (data.status === "manual_review") {
        notice.textContent =
          "Не удалось обработать заявку автоматически. Прочитайте текст и ответьте клиенту вручную.";
        notice.hidden = false;
        return;
      }
      notice.textContent = "Введите текст заявки — он не должен быть пустым.";
      notice.classList.add("error");
      notice.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        renderResult(await reply.json());
      } catch {
        clearOutput();
        notice.textContent = "Сервер недоступен. Попробуйте ещё раз.";
        notice.classList.add("error");
        notice.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
